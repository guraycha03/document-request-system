name: request-system-containers

networks:
  laravel_net:
    driver: bridge

volumes:
  db_data:
    driver: local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: request-app
    restart: unless-stopped
    env_file:
      - .env.container
    volumes:
      - .:/var/www
    networks:
      - laravel_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: request-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_net
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: request-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel_request_container_db
      MYSQL_USER: container_user
      MYSQL_PASSWORD: container_password
      MYSQL_ROOT_PASSWORD: container_root_secure_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
